server:
  port: 8080
  servlet:
    context-path: /

spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jackson:
    deserialization:
      fail_on_unknown_properties: false
  application:
    name: anabilim-purchase-be

  datasource:
    # Ortam değişkenlerinin Docker Compose tarafından sağlanması zorunludur.
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/purchase
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    generate-ddl: true
    hibernate:
      ddl-auto: update
      dialect: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true

  security:
    user:
      name: admin
      password: admin

  # Microsoft OAuth2 Configuration

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24 saat
  refresh-expiration: 604800000  # 7 gün

logging:
  level:
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

client:
  url: https://testsatinalma.anabilim.k12.tr
  url2: http://localhost:5173

microsoft:
  graph:
    client-id: ${MIC_CLIENT_ID}
    client-secret: ${MIC_CLIENT_SECRET}
    tenant-id: ${MIC_TENANT_ID}
    sender-email: hr@talentai.com.tr

app:
  upload-dir: ${UPLOAD_DIR:uploads}

